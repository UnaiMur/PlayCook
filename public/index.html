<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayCook</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>PlayCook</h1>
  <div class="hright">
    <label class="vol" id="volBox" title="Volume">
      <span id="volIcon">🔊</span>
      <input type="range" id="volume" min="0" max="100" step="5" value="80" aria-label="Volume">
    </label>
    <span id="roomCode"></span>
  </div>
</header>

<main>

  <!-- ACCUEIL — plateforme -->
  <section id="screen-home" class="screen">
    <input id="pseudo" placeholder="Ton pseudo" maxlength="16" autocomplete="off">
    <button id="btnCreate" class="primary">Créer une partie</button>
    <div class="sep">ou</div>
    <input id="joinCode" placeholder="Code à 4 lettres" maxlength="4" autocomplete="off" style="text-transform:uppercase">
    <button id="btnJoin">Rejoindre</button>
  </section>

  <!-- SALON — plateforme : joueurs + choix du jeu -->
  <section id="screen-lobby" class="screen">
    <h2>Salon</h2>
    <p class="hint">Partage le code <strong id="lobbyCode"></strong> avec les autres joueurs.</p>
    <ul id="lobbyPlayers" class="players"></ul>
    <h3>Jeu</h3>
    <div id="gamePicker" class="picker"></div>
    <button id="btnStart" class="primary">Démarrer</button>
    <p class="hint" id="lobbyWait"></p>
  </section>

  <!-- PARTIE — le module de jeu remplit #game-root -->
  <section id="screen-game" class="screen">
    <h2 class="gameTitle" id="gameTitle"></h2>
    <div id="game-root"></div>
  </section>

  <!-- CLASSEMENT — plateforme -->
  <section id="screen-scores" class="screen">
    <h2>Classement final</h2>
    <ol id="ranking" class="ranking"></ol>
    <button id="btnBack" class="primary">Retour au salon</button>
    <p class="hint" id="scoresWait"></p>
  </section>

</main>

<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/core/app.js"></script>
</body>
</html>
